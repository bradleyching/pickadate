<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BC 迎新送舊聚餐</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg2: #f5f4f0;
    --bg3: #eeecea;
    --text: #1a1a18;
    --text2: #5f5e5a;
    --text3: #888780;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --radius: 8px;
    --radius-lg: 12px;
    --red50: #FCEBEB;
    --red200: #F09595;
    --red400: #E24B4A;
    --red600: #A32D2D;
    --green50: #EAF3DE;
    --green600: #3B6D11;
    --amber400: #BA7517;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1c;
      --bg2: #2a2a28;
      --bg3: #333330;
      --text: #f0ede8;
      --text2: #b4b2a9;
      --text3: #888780;
      --border: rgba(255,255,255,0.12);
      --border2: rgba(255,255,255,0.22);
      --red50: #4A1B0C;
      --red200: #993C1D;
      --red400: #E24B4A;
      --red600: #F09595;
      --green50: #173404;
      --green600: #97C459;
      --amber400: #EF9F27;
    }
  }

  body {
    font-family: -apple-system, 'Noto Sans TC', 'PingFang TC', sans-serif;
    background: var(--bg2);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
    background: var(--bg);
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border);
    padding: 2rem 1.5rem;
  }

  h1 { font-size: 22px; font-weight: 500; margin-bottom: 6px; }
  .subtitle { font-size: 14px; color: var(--text2); margin-bottom: 1.5rem; }

  .name-row { display: flex; gap: 10px; margin-bottom: 1.5rem; }
  .name-row input {
    flex: 1; height: 38px; font-size: 14px; padding: 0 12px;
    border: 0.5px solid var(--border2); border-radius: var(--radius);
    background: var(--bg); color: var(--text);
  }
  .name-row input:focus { outline: none; box-shadow: 0 0 0 2px var(--red400); }

  .section-label { font-size: 13px; color: var(--text2); margin-bottom: 8px; }

  .legend { display: flex; gap: 14px; margin-bottom: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text2); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  .cal-header {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 4px; margin-bottom: 4px;
  }
  .cal-dow {
    text-align: center; font-size: 12px; font-weight: 500;
    color: var(--text2); padding: 4px 0;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

  .cal-cell {
    aspect-ratio: 1; border-radius: var(--radius);
    border: 0.5px solid var(--border);
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; position: relative;
    transition: border-color 0.15s, background 0.15s;
    user-select: none;
  }
  .cal-cell:hover { border-color: var(--border2); }
  .cal-cell.empty { border: none; cursor: default; background: transparent; }
  .cal-cell.weekend { background: var(--bg2); cursor: not-allowed; }
  .cal-cell.weekend .day-num { color: var(--text3); }
  .cal-cell.weekend::after { content: '✕'; font-size: 10px; color: var(--text3); margin-top: 2px; }
  .cal-cell.weekend:hover { border-color: var(--border); }
  .cal-cell.selected { background: var(--red50); border-color: var(--red400); }
  .cal-cell.selected .day-num { color: var(--red600); font-weight: 500; }
  .cal-cell .day-num { font-size: 15px; color: var(--text); line-height: 1; }
  .cal-cell .dot-row {
    display: flex; gap: 2px; margin-top: 3px;
    flex-wrap: wrap; justify-content: center; max-width: 80%;
  }
  .cal-cell .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--red400); opacity: 0.65; }

  .my-selected {
    margin-top: 1rem; padding: 12px 14px;
    background: var(--bg2); border-radius: var(--radius);
    border: 0.5px solid var(--border);
  }
  .my-selected p { font-size: 13px; color: var(--text2); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tag {
    font-size: 12px; background: var(--red50); color: var(--red600);
    border-radius: var(--radius); padding: 3px 9px;
    border: 0.5px solid var(--red200);
  }

  .submit-btn {
    margin-top: 12px; height: 38px; padding: 0 20px; font-size: 14px;
    border: 0.5px solid var(--border2); border-radius: var(--radius);
    background: var(--bg); color: var(--text); cursor: pointer;
  }
  .submit-btn:hover { background: var(--bg2); }
  .submitted-msg { font-size: 13px; color: var(--green600); margin-top: 10px; font-weight: 500; }

  hr { border: none; border-top: 0.5px solid var(--border); margin: 1.5rem 0; }

  .results-title { font-size: 16px; font-weight: 500; margin-bottom: 1rem; }
  .result-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .result-date { font-size: 13px; color: var(--text2); min-width: 90px; }
  .bar-wrap { flex: 1; height: 8px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
  .bar { height: 100%; border-radius: 99px; background: var(--green600); transition: width 0.4s; }
  .bar.mid { background: var(--amber400); }
  .bar.high { background: var(--red400); }
  .result-count { font-size: 13px; color: var(--text2); min-width: 64px; text-align: right; }
  .voters-list { font-size: 11px; color: var(--text3); padding-left: 100px; margin-bottom: 4px; }
  .empty-state { font-size: 14px; color: var(--text2); padding: 0.5rem 0; }
  .respondents-list { margin-bottom: 1rem; }
  .respondent-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 10px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--bg); margin-bottom: 6px; }
  .respondent-info { flex: 1; min-width: 0; }
  .respondent-name { font-size: 13px; color: var(--text); font-weight: 500; }
  .respondent-days { font-size: 11px; color: var(--text3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .delete-btn { font-size: 12px; color: var(--text3); background: none; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 3px 10px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .delete-btn:hover { border-color: var(--red400); color: var(--red400); background: var(--red50); }

  .best-date-banner {
    background: var(--green50); border: 0.5px solid var(--green600);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 1rem;
    font-size: 14px; color: var(--green600); font-weight: 500;
  }

  .loading { font-size: 14px; color: var(--text3); padding: 0.5rem 0; }
</style>
</head>
<body>

<div class="container">
  <h1>🍽 BC 迎新送舊聚餐</h1>
  <p class="subtitle">請填上你的名字，並點選 <strong>不能參加</strong> 的平日（週六日已排除）</p>

  <div class="name-row">
    <input type="text" id="nameInput" placeholder="你的名字" maxlength="20" autocomplete="off" />
  </div>

  <p class="section-label">點選不能參加的平日（週六日已自動排除）</p>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--red400)"></div>我不能去</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--red400);opacity:0.5"></div>其他人不能去（圓點數 = 人數）</div>
  </div>

  <div class="cal-header">
    <div class="cal-dow" style="color:var(--red400)">日</div>
    <div class="cal-dow">一</div>
    <div class="cal-dow">二</div>
    <div class="cal-dow">三</div>
    <div class="cal-dow">四</div>
    <div class="cal-dow">五</div>
    <div class="cal-dow" style="color:var(--red400)">六</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>

  <div id="mySelectedBox" class="my-selected" style="display:none">
    <p>你選擇的不能參加日期：</p>
    <div class="tags" id="myTags"></div>
    <button class="submit-btn" id="submitBtn">✓ 送出我的選擇</button>
    <div class="submitted-msg" id="submittedMsg" style="display:none">已送出！感謝填寫 🎉</div>
  </div>

  <hr />

  <div id="bestBanner" style="display:none" class="best-date-banner"></div>

  <div class="results-title">衝突統計</div>
  <div id="resultsBody"><p class="loading">載入中...</p></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyABTJv5Z4jB9sZAe_EXCUm2r9yqbObpO5g",
  authDomain: "pickadate-69351.firebaseapp.com",
  databaseURL: "https://pickadate-69351-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "pickadate-69351",
  storageBucket: "pickadate-69351.firebasestorage.app",
  messagingSenderId: "197760597296",
  appId: "1:197760597296:web:5a0778a91d9b7f82f51cf5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const responsesRef = ref(db, 'responses');

let state = { responses: {} };
let mySelected = new Set();
let submitted = false;
let currentName = '';

// Listen for real-time updates from Firebase
onValue(responsesRef, (snapshot) => {
  const data = snapshot.val();
  state.responses = data || {};
  renderCalendar();
  renderResults();
});

async function saveResponse(name, days) {
  await set(ref(db, 'responses/' + name), days);
}

async function deleteResponse(name) {
  await remove(ref(db, 'responses/' + name));
}

function getJuly2025Days() {
  const days = [];
  const startDow = new Date(2025, 6, 1).getDay();
  for (let i = 0; i < startDow; i++) days.push(null);
  for (let d = 1; d <= 31; d++) days.push(d);
  return days;
}

function getConflictCount(day) {
  let count = 0;
  for (const name in state.responses) {
    const arr = state.responses[name];
    if (Array.isArray(arr) && arr.includes(day)) count++;
  }
  return count;
}

function getVoters(day) {
  const names = [];
  for (const name in state.responses) {
    const arr = state.responses[name];
    if (Array.isArray(arr) && arr.includes(day)) names.push(name);
  }
  return names;
}

function totalRespondents() {
  return Object.keys(state.responses).length;
}

function getDOWLabel(d) {
  return ['日','一','二','三','四','五','六'][new Date(2025, 6, d).getDay()];
}

function renderCalendar() {
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const days = getJuly2025Days();

  days.forEach(d => {
    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    if (!d) { cell.classList.add('empty'); grid.appendChild(cell); return; }

    const dow = new Date(2025, 6, d).getDay();
    const isWeekend = dow === 0 || dow === 6;
    if (isWeekend) cell.classList.add('weekend');
    if (!isWeekend && mySelected.has(d)) cell.classList.add('selected');

    const numEl = document.createElement('div');
    numEl.className = 'day-num';
    numEl.textContent = d;
    cell.appendChild(numEl);

    const voters = getVoters(d);
    const othersVoters = voters.filter(n => n !== currentName);
    if (othersVoters.length > 0 && !isWeekend) {
      const dotRow = document.createElement('div');
      dotRow.className = 'dot-row';
      for (let i = 0; i < Math.min(othersVoters.length, 6); i++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        dotRow.appendChild(dot);
      }
      cell.appendChild(dotRow);
    }

    if (!submitted && !isWeekend) {
      cell.addEventListener('click', () => toggleDay(d));
      cell.title = othersVoters.length > 0 ? `不能來：${othersVoters.join('、')}` : '';
    }
    grid.appendChild(cell);
  });
}

function toggleDay(d) {
  if (submitted) return;
  if (mySelected.has(d)) mySelected.delete(d);
  else mySelected.add(d);
  renderCalendar();
  renderMySelected();
}

function renderMySelected() {
  const box = document.getElementById('mySelectedBox');
  const tags = document.getElementById('myTags');
  if (mySelected.size === 0) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  tags.innerHTML = '';
  [...mySelected].sort((a,b)=>a-b).forEach(d => {
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = `7月${d}日`;
    tags.appendChild(tag);
  });
}

async function deletePerson(name) {
  if (!confirm(`確定要刪除「${name}」的所有選擇嗎？`)) return;
  await deleteResponse(name);
}

function buildRespondentList() {
  const respList = document.createElement('div');
  respList.className = 'respondents-list';
  Object.keys(state.responses).forEach(name => {
    const days = state.responses[name];
    const row = document.createElement('div');
    row.className = 'respondent-row';
    row.innerHTML = `
      <div class="respondent-info">
        <div class="respondent-name">${name}</div>
        <div class="respondent-days">不能去：${Array.isArray(days) && days.length ? days.map(d => `7/${d}`).join('、') : '（無）'}</div>
      </div>
      <button class="delete-btn">刪除</button>
    `;
    row.querySelector('.delete-btn').addEventListener('click', () => deletePerson(name));
    respList.appendChild(row);
  });
  return respList;
}

function renderResults() {
  const body = document.getElementById('resultsBody');
  const banner = document.getElementById('bestBanner');
  const total = totalRespondents();

  if (total === 0) {
    body.innerHTML = '<p class="empty-state">還沒有人填寫，快來第一個！</p>';
    banner.style.display = 'none';
    return;
  }

  const dayCounts = [];
  for (let d = 1; d <= 31; d++) {
    const dow = new Date(2025, 6, d).getDay();
    if (dow === 0 || dow === 6) continue;
    const count = getConflictCount(d);
    dayCounts.push({ d, count, voters: getVoters(d) });
  }

  const minConflict = Math.min(...dayCounts.map(x => x.count));
  const bestDays = dayCounts.filter(x => x.count === minConflict).slice(0, 5);
  if (bestDays.length > 0) {
    const dayStr = bestDays.map(x => `7月${x.d}日（${getDOWLabel(x.d)}）`).join('、');
    banner.style.display = 'block';
    banner.textContent = minConflict === 0
      ? `🎉 最佳日期（無人衝突）：${dayStr}`
      : `✓ 衝突最少（${minConflict} 人不能去）：${dayStr}`;
  } else {
    banner.style.display = 'none';
  }

  const sorted = [...dayCounts].filter(x => x.count > 0).sort((a,b) => b.count - a.count);

  body.innerHTML = `<p class="empty-state" style="margin-bottom:12px">共 <strong>${total}</strong> 人填寫</p>`;
  body.appendChild(buildRespondentList());

  if (sorted.length === 0) return;

  const divider = document.createElement('hr');
  divider.style.cssText = 'border:none;border-top:0.5px solid var(--border);margin:0.75rem 0 1rem';
  body.appendChild(divider);

  const maxCount = sorted[0].count;
  sorted.slice(0, 15).forEach(({ d, count, voters }) => {
    const pct = Math.round((count / maxCount) * 100);
    const barClass = count >= maxCount * 0.7 ? 'bar high' : count >= maxCount * 0.4 ? 'bar mid' : 'bar';

    const row = document.createElement('div');
    row.className = 'result-row';
    row.innerHTML = `
      <div class="result-date">7月${d}日（${getDOWLabel(d)}）</div>
      <div class="bar-wrap"><div class="${barClass}" style="width:${pct}%"></div></div>
      <div class="result-count">${count} 人不能去</div>
    `;
    body.appendChild(row);

    const voterDiv = document.createElement('p');
    voterDiv.className = 'voters-list';
    voterDiv.textContent = voters.join('、');
    body.appendChild(voterDiv);
  });
}

document.getElementById('submitBtn').addEventListener('click', async () => {
  currentName = document.getElementById('nameInput').value.trim();
  if (!currentName) { alert('請先輸入你的名字！'); return; }

  const days = [...mySelected].sort((a,b)=>a-b);
  await saveResponse(currentName, days.length ? days : []);
  submitted = true;

  document.getElementById('submittedMsg').style.display = 'block';
  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('nameInput').disabled = true;
});

document.getElementById('nameInput').addEventListener('input', e => {
  currentName = e.target.value.trim();
  renderCalendar();
});
</script>
</body>
</html>
